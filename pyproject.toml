[project]
name = "alma-creditcardslips"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "boto3",
  "click",
  "requests",
  "sentry-sdk",
]

[project.scripts]
ccslips = "ccslips.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ccslips*"]

[dependency-groups]
dev = [
  "boto3-stubs",
  "coveralls",
  "freezegun",
  "moto",
  "mypy",
  "pip-audit",
  "pre-commit",
  "pytest",
  "requests-mock",
  "ruff",
  "types-requests",
]

[tool.mypy]
disallow_untyped_calls = true
disallow_untyped_defs = true
exclude = ["tests/"]

[tool.pytest.ini_options]
log_level = "INFO"

[tool.ruff]
target-version = "py313"
line-length = 90
show-fixes = true

[tool.ruff.lint]
select = ["ALL", "PT"]

ignore = [
  "COM812",
  "D107",
  "N812",
  "PTH",
  "C90",
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "G004",
  "PLR0912",
  "PLR0913",
  "PLR0915",
  "S321",
]
fixable = ["E", "F", "I", "Q"]

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = [
    "ANN",
    "ARG001",
    "S101",
]

[tool.ruff.lint.pycodestyle]
max-doc-length = 90

[tool.ruff.lint.pydocstyle]
convention = "google"